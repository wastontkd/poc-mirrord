<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portal Kubernetes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e293b;
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            margin-bottom: 40px;
        }

        .apps {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .app {
            padding: 30px 60px;
            background: #334155;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-size: 24px;
        }

        .app:hover {
            background: #475569;
        }
    </style>
</head>

<body>
    <h1>Portal de Aplicações</h1>

    <div class="apps">
        <a class="app" href="/web1/">WEB 1</a>
        <a class="app" href="/web2/">WEB 2</a>
    </div>
</body>
</html>
